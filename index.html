
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Data Manager</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            margin: 0;
            padding: 40px 16px;
            color: #1f2937;
        }

        .container {
            max-width: 550px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            text-align: center;
            color: #4f46e5;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #3730a3;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #displayArea {
            margin-top: 25px;
            padding: 20px;
            background: #eef2ff;
            border-radius: 8px;
            display: none;
        }

        .success {
            color: #15803d;
            font-weight: bold;
        }

        .error {
            color: #dc2626;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Student Data Manager</h1>

        <form id="studentForm">

            <label for="studentName">Student Name</label>
            <input
                type="text"
                id="studentName"
                placeholder="Enter student name"
                required
            >

            <label for="studentScore">Student Score</label>
            <input
                type="number"
                id="studentScore"
                placeholder="Enter score (0-100)"
                min="0"
                max="100"
                step="any"
                required
            >

            <button type="submit" id="submitButton">
                Submit Student Details
            </button>

        </form>

        <div id="displayArea" aria-live="polite"></div>
    </div>

    <script>
        const form = document.getElementById("studentForm");
        const displayArea = document.getElementById("displayArea");
        const submitButton = document.getElementById("submitButton");

        form.addEventListener("submit", async function (event) {
            event.preventDefault();

            // Dynamic typing using let
            let studentName = document.getElementById("studentName").value;
            let score = document.getElementById("studentScore").value;

            console.log("Before conversion:");
            console.log("Student Name:", studentName);
            console.log("Name type:", typeof studentName);
            console.log("Score:", score);
            console.log("Score type:", typeof score);

            // Convert string into number
            score = Number(score);

            console.log("After conversion:");
            console.log("Score:", score);
            console.log("Score type:", typeof score);

            // Input validation
            if (
                studentName.trim() === "" ||
                !Number.isFinite(score) ||
                score < 0 ||
                score > 100
            ) {
                displayArea.style.display = "block";
                displayArea.innerHTML =
                    '<p class="error">Please enter a valid name and score between 0 and 100.</p>';
                return;
            }

            // Calculate grade
            let grade;

            if (score >= 90) grade = "A";
            else if (score >= 75) grade = "B";
            else if (score >= 60) grade = "C";
            else if (score >= 40) grade = "D";
            else grade = "F";

            displayArea.style.display = "block";
            displayArea.innerHTML = `
                <h2>Student Information</h2>
                <p><strong>Name:</strong> ${escapeHTML(studentName)}</p>
                <p><strong>Score:</strong> ${score}/100</p>
                <p><strong>Grade:</strong> ${grade}</p>
                <p>Fetching additional information...</p>
            `;

            submitButton.disabled = true;
            submitButton.textContent = "Fetching Data...";

            try {
                // Fetch additional data from a public test API
                const response = await fetch(
                    "https://jsonplaceholder.typicode.com/users/1"
                );

                if (!response.ok) {
                    throw new Error("Failed to fetch user data.");
                }

                const userData = await response.json();

                // Update the webpage without reloading
                displayArea.innerHTML = `
                    <h2>Student Information</h2>
                    <p><strong>Name:</strong> ${escapeHTML(studentName)}</p>
                    <p><strong>Score:</strong> ${score}/100</p>
                    <p><strong>Grade:</strong> ${grade}</p>

                    <hr>

                    <h2>Fetched User Information</h2>
                    <p><strong>Name:</strong> ${escapeHTML(userData.name)}</p>
                    <p><strong>Email:</strong> ${escapeHTML(userData.email)}</p>
                    <p><strong>Company:</strong> ${escapeHTML(userData.company.name)}</p>

                    <p class="success">
                        Data fetched successfully without page reload!
                    </p>
                `;

                console.log("Fetched API Data:", userData);

            } catch (error) {
                console.error("Fetch Error:", error);

                displayArea.innerHTML += `
                    <p class="error">
                        Unable to fetch additional data. Check your internet connection.
                    </p>
                `;

            } finally {
                submitButton.disabled = false;
                submitButton.textContent = "Submit Student Details";
            }
        });

        // Safely display user-provided and API-provided text
        function escapeHTML(value) {
            return String(value).replace(/[&<>"']/g, function (character) {
                const entities = {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': "&quot;",
                    "'": "&#39;"
                };

                return entities[character];
            });
        }
    </script>

</body>
</html>
